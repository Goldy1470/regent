name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests (parsers, rules corpus, entitlement caps, webhook mapping)
        run: npm test
      - name: Build (no external envs — must stay mock-safe)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
